# Automatically label PRs based on changed files

# Application Configuration Labels
base-config:
- '**/base/**'

dev-environment:
- '**/overlays/dev/**'

prod-environment:
- '**/overlays/prod/**'

kubernetes:
- '**/*.yaml'
- '**/*.yml'

kustomize:
- '**/kustomization.yaml'

# Infrastructure
deployment:
- '**/*deployment*.yaml'
- '**/*deployment*.yml'

service:
- '**/*service*.yaml'
- '**/*service*.yml'

configuration:
- '**/*config*.yaml'
- '**/*config*.yml'

# CI/CD
github-actions:
- '.github/workflows/**'

ci-cd:
- '.github/**'

# Documentation
documentation:
- '**/*.md'
- 'docs/**'

# Argo Events
argo-events:
- 'argo-events/**'

argo-workflows:
- 'argo-workflows/**'
- 'argo-workflow-setup/**'

# Security
security:
- '**/*secret*.yaml'
- '**/*secret*.yml'
- '**/*rbac*.yaml'
- '**/*rbac*.yml'