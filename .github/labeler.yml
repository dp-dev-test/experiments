# Automatically label PRs based on changed files

# Application Configuration Labels
base-config:
  - '**/base/**'

dev-environment:
  - '**/overlays/dev/**'

prod-environment:
  - '**/overlays/prod/**'

kustomize:
  - '**/kustomization.yaml'

# Infrastructure
deployment:
  - '**/*deployment*.yaml'
  - '**/*deployment*.yml'

service:
  - '**/*service*.yaml'
  - '**/*service*.yml'

configuration:
  - '**/*config*.yaml'
  - '**/*config*.yml'

# CI/CD
github-actions:
  - .github/workflows/**

ci-cd:
  - .github/**

# Documentation
documentation:
  - '**/*.md'
  - docs/**