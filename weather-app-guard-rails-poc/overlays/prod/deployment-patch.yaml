apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-app-guard-rails-poc
spec:
  template:
    spec:
      containers:
      - name: weather-app-guard-rails-poc
        env:
        - name: NODE_ENV
          value: "production"
        - name: LOG_LEVEL
          value: "info"
        - name: ENABLE_METRICS
          value: "true"
        - name: REDIS_URL
          value: "redis://weather-redis-prod:6379"
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 45
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - weather-app
              topologyKey: kubernetes.io/hostname
      nodeSelector:
        kubernetes.io/os: linux
        node.kubernetes.io/instance-type: Standard_D2s_v3