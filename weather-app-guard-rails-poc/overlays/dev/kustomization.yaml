apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: weather-app-guard-rails-poc-dev

namespace: weather-app-guard-rails-poc-dev

resources:
- ../../base
- namespace.yaml

patchesStrategicMerge:
- deployment-patch.yaml
- service-patch.yaml

replicas:
- name: weather-app-guard-rails-poc
  count: 1

images:
- name: nginx
  newName: nginx
  newTag: 1.21-alpine

configMapGenerator:
- name: weather-app-guard-rails-poc-config-dev
  files:
  - app.conf=configs/dev-app.conf
  - weather.json=configs/dev-weather.json

secretGenerator:
- name: weather-app-guard-rails-poc-secrets-dev
  literals:
  - api-key=dev-api-key-12345

commonLabels:
  environment: development
  tier: frontend

commonAnnotations:
  app.kubernetes.io/version: latest
  deployment.kubernetes.io/revision: "1"