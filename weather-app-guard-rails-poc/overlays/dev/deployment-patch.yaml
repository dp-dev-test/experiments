apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-app-guard-rails-poc
spec:
  template:
    spec:
      containers:
      - name: weather-app-guard-rails-poc
        env:
        - name: NODE_ENV
          value: "development"
        - name: LOG_LEVEL
          value: "debug"
        - name: ENABLE_METRICS
          value: "true"
        - name: DEBUG_MODE
          value: "true"
        - name: HOT_RELOAD
          value: "true"
        - name: REDIS_URL
          value: "redis://weather-redis-dev:6379"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        # Add volume mount for development debugging
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/cache
        - name: dev-logs
          mountPath: /app/logs
      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
      - name: dev-logs
        emptyDir: {}
      # Remove anti-affinity for dev (single node clusters)
      nodeSelector:
        kubernetes.io/os: linux