apiVersion: v1
kind: Service
metadata:
  name: weather-app-guard-rails-poc-service
  annotations:
    # Development service - external access for testing
    service.beta.kubernetes.io/azure-load-balancer-internal: "false"
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
    nodePort: 30080