server {
    listen 8080;
    server_name localhost weather-app-guard-rails-poc.dev.local;
    
    # Development configurations
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log debug;
    
    # CORS for development
    add_header Access-Control-Allow-Origin "*";
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
    add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range";
    
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        
        # Development headers
        add_header X-Debug-Mode "true";
        add_header X-Environment "development";
        add_header X-Project "weather-app-guard-rails-poc";
    }
    
    location /health {
        access_log off;
        return 200 "healthy - guard-rails-poc dev environment\n";
        add_header Content-Type text/plain;
    }
    
    location /ready {
        access_log off;
        return 200 "ready - guard-rails-poc dev environment\n";
        add_header Content-Type text/plain;
    }
    
    location /debug {
        access_log off;
        return 200 "Debug endpoint active - Guard Rails PoC\n";
        add_header Content-Type text/plain;
    }
    
    location /api/ {
        # Proxy to development API server
        proxy_pass http://localhost:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}