apiVersion: v1
kind: ConfigMap
metadata:
  name: weather-app-config
  labels:
    app: weather-app
data:
  app.conf: |
    server {
        listen 8080;
        server_name localhost;
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
        location /ready {
            access_log off;
            return 200 "ready\n";
            add_header Content-Type text/plain;
        }
    }
  weather.json: |
    {
      "api": {
        "timeout": 5000,
        "retries": 3
      },
      "cache": {
        "ttl": 300
      }
    }