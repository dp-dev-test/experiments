apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: weather-app-guard-rails-poc-base

resources:
- deployment.yaml
- service.yaml
- configmap.yaml

commonLabels:
  app: weather-app-guard-rails-poc
  managed-by: kustomize

commonAnnotations:
  app.kubernetes.io/name: weather-app-guard-rails-poc
  app.kubernetes.io/component: backend
  app.kubernetes.io/part-of: weather-guard-rails-system

images:
- name: nginx
  newName: nginx
  newTag: 1.21-alpine

namePrefix: weather-guard-rails-

namespace: weather-app-guard-rails-poc