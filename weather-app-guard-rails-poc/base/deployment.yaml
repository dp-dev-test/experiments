apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-app-guard-rails-poc
  labels:
    app: weather-app-guard-rails-poc
    version: v1.0.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: weather-app-guard-rails-poc
  template:
    metadata:
      labels:
        app: weather-app-guard-rails-poc
        version: v1.0.0
    spec:
      containers:
      - name: weather-app-guard-rails-poc
        image: nginx:1.21-alpine  # Replace with your actual weather app image....
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: NODE_ENV
          value: "development"
        - name: PORT
          value: "8080"
        - name: WEATHER_API_KEY
          valueFrom:
            secretKeyRef:
              name: weather-app-secrets
              key: api-key
        - name: REDIS_URL
          value: "redis://redis-service:6379"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/cache
      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
      securityContext:
        fsGroup: 1000
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
      - key: "kubernetes.azure.com/scalesetpriority"
        operator: "Equal"
        value: "spot"
        effect: "NoSchedule"